name: CI — Lint and Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements-dev.txt') }}

      - name: Install lint tools
        run: pip install ruff black

      - name: Run ruff
        run: ruff check src/ app/ tests/

      - name: Run black (check mode)
        run: black --check src/ app/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements-dev.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install a minimal subset for tests (avoids downloading multi-GB models in CI)
          pip install pytest pytest-cov httpx fastapi omegaconf pydantic

      - name: Install reviewiq package
        run: pip install -e . --no-deps

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          REVIEWIQ_DEVICE: cpu
          PYTHONHASHSEED: "42"
