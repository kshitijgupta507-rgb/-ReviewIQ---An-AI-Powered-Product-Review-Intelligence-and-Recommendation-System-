version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  brief:
    format: "%(levelname)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/reviewiq.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5
    encoding: utf8

root:
  level: DEBUG
  handlers: [console, file]

loggers:
  reviewiq:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  uvicorn:
    level: INFO
  transformers:
    level: WARNING   # suppress verbose HuggingFace logs
  sentence_transformers:
    level: WARNING
